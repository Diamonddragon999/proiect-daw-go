name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: trimite push-ul la coolify
        env:
          SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(jq -nc --arg repo "$REPO" --arg sha "$SHA" '{ref:"refs/heads/main",after:$sha,repository:{full_name:$repo},head_commit:{id:$sha,message:"deploy"},commits:[]}')
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          curl -sS --fail-with-body -X POST https://coolify.cristalsrl.ro/webhooks/source/github/events/manual \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$BODY"
